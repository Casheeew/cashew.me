[package]
name = "cashew-build"
version = "0.1.0"
edition = "2021"

[dependencies]
gray_matter = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tera = "1"
walkdir = "2"
regex = "1"
deunicode = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
comrak = { version = "0.36", default-features = false }
chrono = "0.4"
