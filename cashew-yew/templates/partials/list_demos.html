<div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4">
  {% for demo in demos %}
  <div class="slide-enter" style="--enter-stage: {{ loop.index }}">
    <div class="mb-1 op50 text-sm font-mono">{{ demo.date_display }}</div>
    <video
      src="{{ demo.video_url }}"
      autoplay
      muted
      loop
      playsinline
      class="w-full rounded"
    ></video>
    {% if demo.description %}
    <div class="mt-2 text-sm op75 prose">
      {{ demo.description | safe }}
    </div>
    {% endif %}
    {% if demo.link %}
    <a href="{{ demo.link }}" target="_blank" rel="noopener" class="mt-1 text-xs op50 hover:op100 flex items-center gap-1">
      <span class="i-ri-twitter-x-fill"></span>
      View tweet
    </a>
    {% endif %}
  </div>
  {% endfor %}
</div>
