<div class="photos grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 max-w-500 mx-auto">
  {% for photo in photos %}
  <div>
    <img
      src="{{ photo.url }}"
      alt="{{ photo.name }}"
      data-photo-index="{{ loop.index0 }}"
      loading="lazy"
      class="w-full object-cover aspect-square"
    />
  </div>
  {% endfor %}
</div>
